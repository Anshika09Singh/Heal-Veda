<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Heal Veda | Safety Check</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<!-- NAVBAR -->
<nav class="bg-white shadow">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-green-700">🌿 Heal Veda</h1>

    <div class="space-x-4 text-sm">
      <a href="/" class="hover:text-green-600">Home</a>
      <a href="/safety" class="hover:text-green-600">Safety Check</a>
      <a href="/herbal-plan" class="hover:text-green-600">Herbal Plan</a>
      <a href="/lifestyle" class="hover:text-green-600">Lifestyle</a>
      <a href="/scanner" class="hover:text-green-600">Scanner</a>
      <a href="/chatbot" class="hover:text-green-600">Chatbot</a>
      <a href="/about" class="hover:text-green-600">About</a>
      <a href="/login" class="text-green-700 font-semibold">Login</a>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="max-w-3xl mx-auto p-6">

  <h2 class="text-2xl font-bold text-green-700 mb-4">
    🌿 Wellness Safety Check
  </h2>

  <!-- INPUT CARD -->
  <div class="bg-white p-6 rounded shadow space-y-4">

    <input id="medicines" type="text"
      placeholder="💊 Current allopathic medicine"
      class="w-full border p-2 rounded"/>

    <input id="herbs" type="text"
      placeholder="🌿 Ayurvedic herb or product"
      class="w-full border p-2 rounded"/>

    <select id="prakriti" class="w-full border p-2 rounded">
      <option value="">Select Body Type (Prakriti)</option>
      <option>Vata</option>
      <option>Pitta</option>
      <option>Kapha</option>
    </select>

    <!-- SYMPTOMS -->
    <label class="block text-sm font-medium mt-2">🤒 Symptoms</label>
    <div class="grid grid-cols-2 gap-2 text-sm">
      <label><input type="checkbox" value="Acidity" class="symptom"> Acidity</label>
      <label><input type="checkbox" value="Anxiety" class="symptom"> Anxiety</label>
      <label><input type="checkbox" value="Fatigue" class="symptom"> Fatigue</label>
      <label><input type="checkbox" value="Headache" class="symptom"> Headache</label>
      <label><input type="checkbox" value="Sleep Issues" class="symptom"> Sleep Issues</label>
      <label><input type="checkbox" value="Digestive Issues" class="symptom"> Digestive Issues</label>
    </div>

    <!-- BUTTON -->
    <button
      type="button"
      onclick="sendToBackend()"
      class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded mt-4">
      Check Wellness Risk
    </button>

  </div>

  <!-- RESULT (VISIBLE BY JS) -->
  <div
    id="result"
    class="mt-6 p-4 rounded bg-white shadow border border-green-200 text-gray-800">
  </div>

</div>

<!-- JS -->
<script src="/js/app.js"></script>
</body>
</html>
